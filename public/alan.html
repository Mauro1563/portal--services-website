<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Alan's Cleaner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<style>
  :root{
    --bg:#f4f6fb;--surface:#fff;--surface-2:#f8fafc;--text:#0f172a;--muted:#64748b;--faint:#94a3b8;
    --border:#e6eaf2;--brand:#2563eb;--brand-700:#1d4ed8;--brand-tint:rgba(37,99,235,.10);
    --emerald:#059669;--emerald-tint:rgba(5,150,105,.12);--rose:#e11d48;--rose-tint:rgba(225,29,72,.10);
    --amber:#d97706;--sidebar:#0f172a;--shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.08);
    --shadow-lg:0 18px 44px -20px rgba(15,23,42,.4);--radius:16px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  :root[data-theme="dark"]{
    --bg:#0b1120;--surface:#111a2e;--surface-2:#0e1626;--text:#e6edf7;--muted:#94a3b8;--faint:#64748b;
    --border:#1e2a41;--brand-tint:rgba(59,130,246,.16);--emerald:#34d399;--emerald-tint:rgba(52,211,153,.14);
    --rose:#fb7185;--rose-tint:rgba(251,113,133,.14);--sidebar:#0a0f1e;--shadow:none;--shadow-lg:0 18px 44px -20px rgba(0,0,0,.6);
  }
  @media(prefers-color-scheme:dark){:root:not([data-theme]){
    --bg:#0b1120;--surface:#111a2e;--surface-2:#0e1626;--text:#e6edf7;--muted:#94a3b8;--faint:#64748b;
    --border:#1e2a41;--brand-tint:rgba(59,130,246,.16);--emerald:#34d399;--emerald-tint:rgba(52,211,153,.14);
    --rose:#fb7185;--rose-tint:rgba(251,113,133,.14);--sidebar:#0a0f1e;--shadow:none;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  .sidebar{background:var(--sidebar);color:#fff;padding:16px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 14px}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#60a5fa,#2563eb);display:grid;place-items:center;font-size:18px}
  .brand b{font-size:15px;font-weight:700}.brand small{display:block;font-weight:400;color:rgba(255,255,255,.5);font-size:11px}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:rgba(255,255,255,.72);font-size:13.5px;font-weight:500;cursor:pointer;text-decoration:none}
  .nav a:hover{background:rgba(255,255,255,.06);color:#fff}.nav a.active{background:rgba(37,99,235,.28);color:#fff}
  .nav a svg{width:17px;height:17px;opacity:.9}.sidebar .spacer{flex:1}
  .signout{display:flex;align-items:center;gap:10px;padding:9px 11px;color:rgba(255,255,255,.5);font-size:13px;border-top:1px solid rgba(255,255,255,.08);margin-top:6px;cursor:pointer}
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:5}
  .content{padding:22px 26px 60px;max-width:1080px;width:100%}
  h1.page{font-size:23px;font-weight:700;letter-spacing:-.02em;margin:0}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .ic{width:16px;height:16px;color:var(--brand)}
  .pill-btn{height:34px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:0 11px;font:inherit;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
  .pill-btn:hover{background:var(--surface-2)}
  select.lang{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:7px 24px 7px 12px;font:inherit;font-size:12.5px;cursor:pointer}
  .btn{height:38px;border:0;background:var(--brand);color:#fff;border-radius:10px;padding:0 16px;font:inherit;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
  .btn:hover{background:var(--brand-700)}.btn.sm{height:34px;padding:0 13px;font-size:12.5px}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}.btn.ghost:hover{background:var(--surface-2)}
  .btn.danger{background:transparent;border:1px solid var(--rose);color:var(--rose)}.btn.danger:hover{background:var(--rose-tint)}
  .grid{display:grid;gap:12px}.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}.card.pad{padding:18px}
  .kpi .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);display:flex;justify-content:space-between;align-items:center}
  .kpi .value{font-size:25px;font-weight:700;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}
  .chip{border-radius:999px;font-size:10px;font-weight:600;padding:2px 7px}.chip.good{color:var(--emerald);background:var(--emerald-tint)}
  .section-title{font-size:15px;font-weight:650;margin:0}.section-sub{font-size:11.5px;color:var(--faint);margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--border)}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--border)}tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .tag{border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:500;background:var(--brand-tint);color:var(--brand)}
  .tag.gray{background:var(--surface-2);color:var(--muted)}.tag.green{background:var(--emerald-tint);color:var(--emerald)}.tag.amber{background:rgba(217,119,6,.12);color:var(--amber)}.tag.rose{background:var(--rose-tint);color:var(--rose)}
  .row-act{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;color:var(--muted);cursor:pointer;border:0;background:transparent}
  .row-act:hover{background:var(--surface-2)}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:14px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 12px}
  .cal-nav{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;cursor:pointer;color:var(--muted);border:0;background:transparent}.cal-nav:hover{background:var(--surface-2)}
  .cal-month{font-weight:650;font-size:14px;text-transform:capitalize}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
  .cal-dow{text-align:center;font-size:10.5px;text-transform:uppercase;color:var(--faint);font-weight:600;padding-bottom:2px}
  .cal-cell{min-height:82px;border:1px solid var(--border);border-radius:10px;padding:5px;cursor:pointer}

  .cal-daynum{font-size:11px;color:var(--muted);padding:0 3px}.cal-cell.today .cal-daynum{color:var(--brand);font-weight:700}
  .ev{margin-top:3px;font-size:10px;border-radius:5px;padding:2px 5px;background:var(--brand-tint);color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev.done{background:var(--emerald-tint);color:var(--emerald)}.ev.cancel{background:var(--rose-tint);color:var(--rose);text-decoration:line-through}

  .modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}

  .modal-f{padding:14px 20px 20px;display:flex;gap:10px;justify-content:space-between}
  .field{display:block}.field span{font-size:12px;font-weight:500;color:var(--muted)}
  .field .req{color:var(--rose)}
  .field input,.field select,.field textarea{margin-top:6px;width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:11px;background:transparent;color:var(--text);font:inherit;font-size:14px}

  .form-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .err{color:var(--rose);font-size:11px;margin-top:4px;display:none}.err.show{display:block}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .2s,transform .2s;z-index:60;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:500;padding:5px 11px;border-radius:6px;cursor:pointer}.seg button.on{background:var(--brand);color:#fff}
  .reminder{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}.reminder:last-child{border-bottom:0}
  @media(max-width:820px){
    .app{grid-template-columns:1fr}.sidebar{position:fixed;left:-240px;transition:left .2s;z-index:40;width:230px}
    .sidebar.open{left:0}.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}.cols-2{grid-template-columns:minmax(0,1fr)}
    .menu-btn{display:inline-grid!important}.content{padding:16px 14px 60px}.form-2{grid-template-columns:1fr}
  }
  .menu-btn{display:none;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);cursor:pointer;margin-right:auto}
  .print-head{display:none}
  @media print{
    :root{--bg:#fff;--surface:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#475569;--faint:#94a3b8}
    .sidebar,.topbar,.menu-btn,.btn,.seg,.cal-nav,.row-act,.signout{display:none!important}
    .app{display:block}.content{padding:0;max-width:none}
    .card{box-shadow:none;break-inside:avoid}.cal-cell{min-height:64px}
    .print-head{display:block;border-bottom:2px solid var(--brand);padding-bottom:10px;margin-bottom:16px}
    .print-head b{font-size:16px}.print-head .t{color:var(--brand);font-weight:700;font-size:12px}.print-head .m{color:var(--muted);font-size:10px}
    @page{margin:16mm}
  }
</style>
</head>

</div>

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function costOf(s){const e=S.employees.find(x=>x.id===s.employeeId);const rate=e?e.pagoPorHoraCents:0;return Math.round(rate*(s.duracionHoras||0))}
function financeTotals(){const done=S.services.filter(s=>s.estado==='completado');const income=done.reduce((a,s)=>a+(s.precioCents||0),0);const cost=done.reduce((a,s)=>a+costOf(s),0);const profit=income-cost;return{income,cost,profit,margin:income?Math.round(profit/income*100):0,hours:done.reduce((a,s)=>a+(s.duracionHoras||0),0)}}
function monthlySeries(){const now=new Date();const out=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);out.push({key:d.getFullYear()+'-'+d.getMonth(),label:MONTHS[S.settings.lang][d.getMonth()].slice(0,3),income:0,profit:0})}
 const idx=new Map(out.map((o,i)=>[o.key,i]));S.services.filter(s=>s.estado==='completado').forEach(s=>{const d=new Date(s.fecha+'T00:00:00');const i=idx.get(d.getFullYear()+'-'+d.getMonth());if(i==null)return;out[i].income+=(s.precioCents||0)/100;out[i].profit+=((s.precioCents||0)-costOf(s))/100});return out.map(o=>({...o,income:Math.round(o.income),profit:Math.round(o.profit)}))}

function chartSVG(){const data=monthlySeries();const W=520,H=210,pad=28,n=data.length;const maxV=Math.max(1,...data.map(d=>d.income))*1.1;const x=i=>pad+(W-pad*2)*(i+0.5)/n;const y=v=>H-24-(H-44)*(v/maxV);const bw=(W-pad*2)/n*0.5;let o='';for(let g=0;g<=3;g++){const gy=20+(H-44)*g/3;o+=`<line x1="${pad}" y1="${gy}" x2="${W-pad}" y2="${gy}" stroke="var(--border)"/>`}data.forEach((d,i)=>{o+=`<rect x="${x(i)-bw/2}" y="${y(d.income)}" width="${bw}" height="${H-24-y(d.income)}" rx="3" fill="#2563eb"/>`});const pts=data.map((d,i)=>`${x(i)},${y(d.profit)}`).join(' ');o+=`<polyline points="${pts}" fill="none" stroke="#10b981" stroke-width="2.5"/>`;data.forEach((d,i)=>{o+=`<circle cx="${x(i)}" cy="${y(d.profit)}" r="3.2" fill="#10b981"/>`});data.forEach((d,i)=>{o+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--faint)">${d.label}</text>`});return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${o}</svg>`}

function saveConfig(){S.settings.business=document.getElementById('cfgName').value.trim()||"Alan's Cleaner";S.settings.currency=document.getElementById('cfgCur').value;persist();toast(t('saved'));render()}
function openModal(html){document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function num(v){const n=Number(String(v).replace(',','.'));return isFinite(n)?n:0}
function clientForm(id){
 const c=id?S.clients.find(x=>x.id===id):{nombre:'',direccion:'',telefono:'',email:'',horasContratadas:2,frecuencia:'semanal',precioPorServicioCents:0,empleadaId:'',estado:'activo',observaciones:''};
 const empOpts=`<option value="">${t('none')}</option>`+S.employees.map(e=>`<option value="${e.id}" ${e.id===c.empleadaId?'selected':''}>${esc(e.nombre)}</option>`).join('');
 openModal(`
  <div class="modal-h"><h2>${id?t('editClient'):t('newClient')}</h2><button class="row-act" onclick="closeModal()">${ICON.x}</button></div>
  <div class="modal-b">
   <label class="field"><span>${t('name')} <b class="req">*</b></span><input id="f_nombre" value="${esc(c.nombre)}"><div class="err" id="e_nombre">${t('required')}</div></label>
   <div class="form-2">
    <label class="field"><span>${t('phone')}</span><input id="f_tel" value="${esc(c.telefono)}"></label>
    <label class="field"><span>${t('email')}</span><input id="f_email" value="${esc(c.email)}"></label>
   </div>
   <label class="field"><span>${t('address')}</span><input id="f_dir" value="${esc(c.direccion)}"></label>
   <div class="form-2">
    <label class="field"><span>${t('contracted')}</span><input id="f_horas" type="number" step="0.5" min="0" value="${c.horasContratadas}"></label>
    <label class="field"><span>${t('price')} (${S.settings.currency})</span><input id="f_precio" type="number" step="0.01" min="0" value="${(c.precioPorServicioCents/100)||''}"></label>
   </div>
   <div class="form-2">
    <label class="field"><span>${t('frequency')}</span><select id="f_freq">${['semanal','quincenal','mensual','personalizada'].map(k=>`<option value="${k}" ${k===c.frecuencia?'selected':''}>${t('freq')[k]}</option>`).join('')}</select></label>
    <label class="field"><span>${t('assigned')}</span><select id="f_emp">${empOpts}</select></label>
   </div>
   <label class="field"><span>${t('status')}</span><select id="f_est">${['activo','pausado','inactivo'].map(k=>`<option value="${k}" ${k===c.estado?'selected':''}>${t('estC')[k]}</option>`).join('')}</select></label>
   <label class="field"><span>${t('notes')}</span><textarea id="f_obs" rows="2">${esc(c.observaciones)}</textarea></label>
  </div>
  <div class="modal-f"><button class="btn ghost" onclick="closeModal()">${t('cancel')}</button><button class="btn" onclick="saveClient('${id||''}')">${t('save')}</button></div>`);
}
function saveClient(id){
 const nombre=document.getElementById('f_nombre').value.trim();
 if(!nombre){document.getElementById('e_nombre').classList.add('show');return}
 const data={nombre,telefono:document.getElementById('f_tel').value.trim(),email:document.getElementById('f_email').value.trim(),direccion:document.getElementById('f_dir').value.trim(),
  horasContratadas:num(document.getElementById('f_horas').value),frecuencia:document.getElementById('f_freq').value,
  precioPorServicioCents:Math.round(num(document.getElementById('f_precio').value)*100),empleadaId:document.getElementById('f_emp').value||'',estado:document.getElementById('f_est').value,observaciones:document.getElementById('f_obs').value.trim()};
 if(id){Object.assign(S.clients.find(c=>c.id===id),data)}else{S.clients.push({id:uid(),...data})}
 persist();closeModal();toast(t('saved'));render();
}
function delClient(id){if(!confirm(t('confirmDel')))return;S.clients=S.clients.filter(c=>c.id!==id);persist();toast(t('deleted'));render()}
function empForm(id){
 const e=id?S.employees.find(x=>x.id===id):{nombre:'',telefono:'',email:'',pagoPorHoraCents:0};
 openModal(`
  <div class="modal-h"><h2>${id?t('editEmp'):t('newEmp')}</h2><button class="row-act" onclick="closeModal()">${ICON.x}</button></div>
  <div class="modal-b">
   <label class="field"><span>${t('name')} <b class="req">*</b></span><input id="g_nombre" value="${esc(e.nombre)}"><div class="err" id="ge_nombre">${t('required')}</div></label>
   <div class="form-2"><label class="field"><span>${t('phone')}</span><input id="g_tel" value="${esc(e.telefono)}"></label>
    <label class="field"><span>${t('email')}</span><input id="g_email" value="${esc(e.email)}"></label></div>
   <label class="field"><span>${t('pay')} (${S.settings.currency})</span><input id="g_pago" type="number" step="0.01" min="0" value="${(e.pagoPorHoraCents/100)||''}"></label>
  </div>
  <div class="modal-f"><button class="btn ghost" onclick="closeModal()">${t('cancel')}</button><button class="btn" onclick="saveEmp('${id||''}')">${t('save')}</button></div>`);
}
function saveEmp(id){const nombre=document.getElementById('g_nombre').value.trim();if(!nombre){document.getElementById('ge_nombre').classList.add('show');return}
 const data={nombre,telefono:document.getElementById('g_tel').value.trim(),email:document.getElementById('g_email').value.trim(),pagoPorHoraCents:Math.round(num(document.getElementById('g_pago').value)*100)};
 if(id){Object.assign(S.employees.find(e=>e.id===id),data)}else{S.employees.push({id:uid(),...data})}
 persist();closeModal();toast(t('saved'));render();
}
function delEmp(id){if(!confirm(t('confirmDel')))return;S.employees=S.employees.filter(e=>e.id!==id);S.clients.forEach(c=>{if(c.empleadaId===id)c.empleadaId=''});persist();toast(t('deleted'));render()}
function serviceForm(id,presetDate){
 const s=id?S.services.find(x=>x.id===id):{clientId:'',employeeId:'',fecha:presetDate||todayISO(),horaInicio:'09:00',duracionHoras:2,precioCents:0,estado:'programado',estadoPago:'pendiente'};
 const cliOpts=`<option value="">${t('selectClient')}</option>`+S.clients.map(c=>`<option value="${c.id}" ${c.id===s.clientId?'selected':''}>${esc(c.nombre)}</option>`).join('');
 const empOpts=`<option value="">${t('none')}</option>`+S.employees.map(e=>`<option value="${e.id}" ${e.id===s.employeeId?'selected':''}>${esc(e.nombre)}</option>`).join('');
 openModal(`
  <div class="modal-h"><h2>${id?t('editService'):t('newService')}</h2><button class="row-act" onclick="closeModal()">${ICON.x}</button></div>
  <div class="modal-b">
   <label class="field"><span>${t('client')} <b class="req">*</b></span><select id="s_cli" onchange="svcPrefill()">${cliOpts}</select><div class="err" id="se_cli">${t('required')}</div></label>
   <div class="form-2"><label class="field"><span>${t('employee')}</span><select id="s_emp">${empOpts}</select></label>
    <label class="field"><span>${t('date')}</span><input id="s_fecha" type="date" value="${s.fecha}"></label></div>
   <div class="form-2"><label class="field"><span>${t('time')}</span><input id="s_hora" type="time" value="${s.horaInicio||''}"></label>
    <label class="field"><span>${t('duration')}</span><input id="s_dur" type="number" step="0.5" min="0.5" value="${s.duracionHoras}"></label></div>
   <div class="form-2"><label class="field"><span>${t('price')} (${S.settings.currency})</span><input id="s_precio" type="number" step="0.01" min="0" value="${(s.precioCents/100)||''}"></label>
    <label class="field"><span>${t('status')}</span><select id="s_est">${['programado','en_progreso','completado','cancelado'].map(k=>`<option value="${k}" ${k===s.estado?'selected':''}>${t('estS')[k]}</option>`).join('')}</select></label></div>
  </div>
  <div class="modal-f"><div>${id?`<button class="btn danger" onclick="delService('${id}')">${t('del')}</button>`:''}</div>
   <div style="display:flex;gap:10px"><button class="btn ghost" onclick="closeModal()">${t('cancel')}</button><button class="btn" onclick="saveService('${id||''}')">${t('save')}</button></div></div>`);
}
function svcPrefill(){const cid=document.getElementById('s_cli').value;const c=S.clients.find(x=>x.id===cid);if(!c)return;
 if(!num(document.getElementById('s_precio').value))document.getElementById('s_precio').value=(c.precioPorServicioCents/100)||'';
 if(c.empleadaId&&!document.getElementById('s_emp').value)document.getElementById('s_emp').value=c.empleadaId;
 if(c.horasContratadas)document.getElementById('s_dur').value=c.horasContratadas;}
function saveService(id){
 const cid=document.getElementById('s_cli').value;if(!cid){document.getElementById('se_cli').classList.add('show');return}
 const c=S.clients.find(x=>x.id===cid);const eid=document.getElementById('s_emp').value;const e=S.employees.find(x=>x.id===eid);
 const data={clientId:cid,clienteNombre:c?c.nombre:'',employeeId:eid,empleadaNombre:e?e.nombre:'',fecha:document.getElementById('s_fecha').value,horaInicio:document.getElementById('s_hora').value||null,
  duracionHoras:num(document.getElementById('s_dur').value)||1,precioCents:Math.round(num(document.getElementById('s_precio').value)*100),estado:document.getElementById('s_est').value};
 if(id){Object.assign(S.services.find(s=>s.id===id),data)}else{S.services.push({id:uid(),estadoPago:'pendiente',...data})}
 persist();closeModal();toast(t('saved'));render();
}
function delService(id){S.services=S.services.filter(s=>s.id!==id);persist();closeModal();toast(t('deleted'));render()}
document.getElementById('nav').addEventListener('click',e=>{const a=e.target.closest('a[data-r]');if(a)go(a.dataset.r)});
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.getElementById('lang').addEventListener('change',e=>{S.settings.lang=e.target.value;persist();render()});
document.getElementById('theme').addEventListener('click',()=>{const dark=isDark();document.documentElement.setAttribute('data-theme',dark?'light':'dark');S.settings.theme=dark?'light':'dark';persist();render()});
document.getElementById('reset').addEventListener('click',()=>{if(confirm('¿Reiniciar todos los datos de ejemplo?')){localStorage.removeItem(KEY);S=seed();persist();applyTheme();render()}});
function applyTheme(){if(S.settings.theme)document.documentElement.setAttribute('data-theme',S.settings.theme);else document.documentElement.removeAttribute('data-theme')}
Object.assign(window,{go,clientForm,saveClient,delClient,empForm,saveEmp,delEmp,serviceForm,saveService,delService,svcPrefill,calShift,calToday,saveConfig,closeModal,exportData,importData,printFinance,printAgenda,printReport});
applyTheme();render();
</script>
</body>
</html>
